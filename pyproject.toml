[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-sentinel"
version = "1.0.0"
description = "Enterprise Authentication Log Forensics, Threat Detection & SIEM Correlation Platform"
readme = "README.md"
authors = [{ name = "Detection Engineering Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
keywords = ["cybersecurity", "soc", "siem", "mitre-attack", "brute-force", "log-analysis", "forensics"]

[project.scripts]
auth-sentinel = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_sentinel*"]
